name: build-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # The ubuntu runner ships with the Android SDK in this directory.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages and NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;28.2.13676358"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName=V5.2.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: drift-ru-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
