name: build-apk

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/Cargo.lock') }}

      - name: Rust tests
        working-directory: rust
        run: cargo test --locked

      - name: Clippy
        working-directory: rust
        run: cargo clippy --locked --all-targets

  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The ubuntu runner ships with the Android SDK in this directory.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Empty when the repository has no release-key secrets; the build then
      # falls back to the committed debug key.
      DRIFT_KEYSTORE_B64: ${{ secrets.DRIFT_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages and NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;28.2.13676358"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Decode release keystore
        if: env.DRIFT_KEYSTORE_B64 != ''
        run: |
          echo "$DRIFT_KEYSTORE_B64" | base64 --decode > android/app/drift-release.keystore
          {
            echo "DRIFT_KEYSTORE=$GITHUB_WORKSPACE/android/app/drift-release.keystore"
            echo "DRIFT_KEY_ALIAS=${{ secrets.DRIFT_KEY_ALIAS }}"
            echo "DRIFT_KEYSTORE_PASSWORD=${{ secrets.DRIFT_KEYSTORE_PASSWORD }}"
            echo "DRIFT_KEY_PASSWORD=${{ secrets.DRIFT_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Compute version
        id: ver
        run: |
          # Above the old 7..9 so a fork build installs over the official APK.
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=V5.6.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: drift-ru-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
