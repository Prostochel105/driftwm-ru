plugins {
    id 'com.android.application'
}

// ABIs to build the Rust core for. A phone needs only arm64-v8a; add x86_64
// for the emulator:  ./gradlew assembleRelease -PdriftAbis=arm64-v8a,x86_64
def abis = (project.findProperty('driftAbis') ?: 'arm64-v8a').toString().split(',').collect { it.trim() }
// CI passes its run number so every build installs over the previous one.
def vCode = (project.findProperty('versionCode') ?: '10').toString()
def vName = (project.findProperty('versionName') ?: 'V5.6').toString()
def rustDir = file("$rootDir/../rust")
def jniOut = file("$projectDir/src/main/jniLibs")

// Optional real release key. CI decodes a keystore and exports these variables;
// without them the release build keeps the committed debug key so local builds
// still install over each other. All four must be present, or signing would
// fail halfway through the build.
def releaseStore = System.getenv('DRIFT_KEYSTORE')
def releaseAlias = System.getenv('DRIFT_KEY_ALIAS')
def releaseStorePass = System.getenv('DRIFT_KEYSTORE_PASSWORD')
def releaseKeyPass = System.getenv('DRIFT_KEY_PASSWORD')
def hasReleaseKey = [releaseStore, releaseAlias, releaseStorePass, releaseKeyPass]
    .every { it != null && !it.trim().isEmpty() }

// The Rust core is always built in release mode (a debug build of the canvas
// logic is too slow to judge gestures by). Needs cargo-ndk and an NDK r28+
// (16 KB page alignment by default).
def cargoNdk = tasks.register('cargoNdk', Exec) {
    group = 'build'
    description = 'Builds libdrift_core.so with cargo-ndk'
    workingDir rustDir
    inputs.files(fileTree(dir: rustDir, include: ['src/**', 'Cargo.toml', 'Cargo.lock']))
    inputs.property('abis', abis.join(','))
    outputs.dir(jniOut)
    def args = ['cargo', 'ndk', '--platform', '30']
    abis.each { args += ['-t', it] }
    args += ['-o', jniOut.absolutePath, 'build', '--release']
    commandLine args
}

android {
    namespace 'dev.drift.launcher'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.drift.launcher'
        minSdk 30
        targetSdk 36
        versionCode vCode.toInteger()
        versionName vName
        ndk { abiFilters(*abis) }
    }

    signingConfigs {
        debug {
            // Fixed debug key committed to the repo so that every CI build can be
            // installed over the previous one without uninstalling (layout kept).
            storeFile file('drift-ru-debug.keystore')
            storePassword 'driftru'
            keyAlias 'driftru'
            keyPassword 'driftru'
        }
        if (hasReleaseKey) {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePass
                keyAlias releaseAlias
                keyPassword releaseKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // A real key when CI has one; otherwise the debug key (still not
            // debuggable, because this is the release build type).
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main { jniLibs.srcDir(tasks.named('cargoNdk')) }  // implicit task dependency
    }
}

if (project.hasProperty('skipRust')) {
    cargoNdk.configure { enabled = false }
} else {
    preBuild.dependsOn 'cargoNdk'
}
